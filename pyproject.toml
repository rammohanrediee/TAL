[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tal"
version = "0.1.0"
description = "A tool-assisted job search and application management backend."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.13,<2",
  "asyncpg>=0.29,<1",
  "celery[redis]>=5.4,<6",
  "fastapi>=0.115,<1",
  "pydantic-settings>=2.6,<3",
  "python-multipart>=0.0.12,<1",
  "sqlalchemy[asyncio]>=2.0.36,<3",
  "uvicorn[standard]>=0.32,<1",
  "psycopg[binary]>=3.2,<4",
  "pwdlib[argon2]",
  "email-validator",
  "PyJWT>=2.10,<3",
  "authlib>=1.6,<2",
  "itsdangerous>=2.2,<3",

]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1",
  "mypy>=1.13,<2",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
  "pytest-cov>=6,<7",
  "ruff>=0.8,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/tal"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers --cov=tal --cov-report=term-missing"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
packages = ["tal"]


name: Deploy Cloudflare Worker

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  deploy-worker:
    runs-on: ubuntu-latest
    environment: tal
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: "7d5384774f902334062aefe38e7e58f3"

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install backend for migrations
        run: python -m pip install -e .

      - name: Run database migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
          JWT_SECRET_KEY: deploy-migrate-only
          JOB_SCAN_SECRET: deploy-migrate-only
          CHAT_TOOL_SECRET: deploy-migrate-only
          R2_ACCOUNT_ID: deploy
          R2_ACCESS_KEY_ID: deploy
          R2_SECRET_ACCESS_KEY: deploy
          R2_BUCKET_NAME: deploy
          R2_ENDPOINT_URL: https://example.invalid
          OAUTH_STATE_SECRET: deploy-migrate-only
        run: alembic upgrade head

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Deploy Worker
        run: npx wrangler deploy